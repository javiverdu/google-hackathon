[project]
name = "erasmus-docflow"
version = "0.1.0"
description = "Erasmus document agent for the international office"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 110
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: calls the real Gemini API (set RUN_LLM_TESTS=1)",
]
